spring.application.name=constructora-api

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://isanorte-frontend.vercel.app}
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/isanorte_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:isanorte_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
# Bloqueo temporal: V13 y V14 requieren autorizacion y validacion separadas.
spring.flyway.target=12

app.seed.demo-products=${SEED_DEMO_PRODUCTS:false}
app.seed.demo-home-isadecor=${SEED_DEMO_HOME_ISADECOR:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

app.auth.admin-role=${ADMIN_ROLE:ADMINISTRADOR}
app.auth.initial-email=${ADMIN_EMAIL:}
app.auth.initial-password=${ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}

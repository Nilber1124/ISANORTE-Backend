spring.application.name=constructora-api

spring.datasource.url=jdbc:postgresql://localhost:5432/isanorte_db
spring.datasource.username=isanorte_user
spring.datasource.password=Nil71232516

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Autenticacion administrativa. No definir secretos por defecto.
app.auth.admin-role=ADMINISTRADOR
app.auth.initial-email=${ADMIN_EMAIL:}
app.auth.initial-password=${ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}

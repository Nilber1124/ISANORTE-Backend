spring.application.name=constructora-api

spring.datasource.url=jdbc:postgresql://localhost:5432/isanorte_db
spring.datasource.username=postgres
spring.datasource.password=wiliamxprod

server.port=1234

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Seed
app.seed.demo-products=false

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Autenticacion administrativa
app.auth.admin-role=ADMINISTRADOR
app.auth.initial-email=admin@isanorte.com
app.auth.initial-password=Admin12345678!

# JWT LOCAL
app.jwt.secret=isanorte-jwt-secret-local-2026-desarrollo-seguro
app.jwt.expiration=PT8H
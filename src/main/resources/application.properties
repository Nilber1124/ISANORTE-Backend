spring.application.name=constructora-api

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://*.vercel.app,https://isanorte-frontend.vercel.app}

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/isanorte_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:isanorte_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Seed opt-in para demostraciones. Nunca se activa por defecto ni crea categorías.
app.seed.demo-products=${SEED_DEMO_PRODUCTS:false}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Autenticacion administrativa. No definir secretos por defecto.
app.auth.admin-role=ADMINISTRADOR
app.auth.initial-email=${ADMIN_EMAIL:}
app.auth.initial-password=${ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}

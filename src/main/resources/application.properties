spring.application.name=constructora-api

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/isanorte_db}
spring.datasource.username=${DATABASE_USERNAME:isanorte_user}
spring.datasource.password=${DATABASE_PASSWORD}

# Puerto
server.port=${PORT:8080}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Seed
app.seed.demo-products=${SEED_DEMO_PRODUCTS:false}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Autenticacion administrativa
app.auth.admin-role=ADMINISTRADOR
app.auth.initial-email=${ADMIN_EMAIL:}
app.auth.initial-password=${ADMIN_PASSWORD:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}



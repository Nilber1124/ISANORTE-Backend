spring.application.name=constructora-api

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://*.vercel.app,https://isanorte-frontend.vercel.app}

server.port=${PORT:8080}

# Base de datos PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/isanorte_db
spring.datasource.username=postgres
spring.datasource.password=wiliamxprod

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

# Seed opt-in para demostraciones. Nunca se activa por defecto ni crea categorías.
app.seed.demo-products=${SEED_DEMO_PRODUCTS:false}
app.seed.demo-home-isadecor=${SEED_DEMO_HOME_ISADECOR:false}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Autenticacion administrativa. No definir secretos por defecto.
app.auth.admin-role=ADMINISTRADOR
app.auth.initial-email=${ADMIN_EMAIL:}
app.auth.initial-password=${ADMIN_PASSWORD:}
app.jwt.secret=${D96D3A8682996EFB60F769C1E2CB5E6427A4FA6778C6E09DB0478BB2757C40EC}
app.jwt.expiration=PT8H

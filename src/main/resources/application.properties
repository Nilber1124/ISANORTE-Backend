spring.application.name=constructora-api

# Port dynamically assigned by Render or default to 8080
server.port=${PORT:8080}

# Database credentials (defaults to local, overridable in Render/production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/isanorte_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:isanorte_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nil71232516}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Allowed CORS origins (comma-separated, supports wildcards like https://*.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,https://*.vercel.app}

